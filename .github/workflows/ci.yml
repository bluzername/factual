name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MVP/factual/requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q MVP/factual agentic_workflow.py quick_start.py file_uploader.py example_batch_runner.py
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -rs
